<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://gesajkzhhpzczlflsacc.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>LobeRAS — Secure Dashboard Access</title>
<style>
:root{color-scheme:light;--ink:#111;--paper:#fff;--line:#aaa;--green:#087f23;--red:#b00020}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Arial,sans-serif}
header{border-bottom:2px solid var(--ink);padding:18px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center}
h1{font-size:22px;margin:0}main{max-width:680px;margin:70px auto;padding:0 24px}.panel{border:2px solid var(--ink);padding:28px}
label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;border:1px solid var(--ink);padding:12px;font:inherit}
button{margin-top:16px;background:#111;color:#fff;border:1px solid #111;padding:12px 18px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}
.hidden{display:none}.success{color:var(--green)}.error{color:var(--red)}.note{color:#555}.status{font-weight:700}
</style>
</head>
<body>
<header><h1>LobeRAS — Secure Dashboard</h1><div class="status" id="sessionStatus">AUTHENTICATION REQUIRED</div></header>
<main><section class="panel">
<h2>Approved user access</h2>
<p class="note">Owner/Operator and approved Developer access. Each user receives a separate one-time code.</p>
<div id="emailStep">
<label for="email">Approved email address</label>
<input id="email" type="email" autocomplete="email" placeholder="Enter your approved email address">
<button id="requestCode" type="button">SEND ONE-TIME CODE</button>
</div>
<div id="codeStep" class="hidden">
<label for="code">One-time code or complete sign-in link received by email</label>
<input id="code" autocomplete="one-time-code" placeholder="Enter the code or paste the complete email link">
<button id="verifyCode" type="button">OPEN DASHBOARD</button>
</div>
<p id="message" aria-live="polite"></p>
</section></main>
<script>
const apiBase="https://gesajkzhhpzczlflsacc.supabase.co/functions/v1/loberas-dashboard";
const state={email:"",token:sessionStorage.getItem("loberas_access_token")||""};
const $=id=>document.getElementById(id);
function showMessage(text,error=false){$("message").textContent=text;$("message").className=error?"error":"success"}
async function post(path,body){const r=await fetch(apiBase+path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||"Request failed");return data}
async function openDashboard(){const r=await fetch(apiBase+"/api/reconciled-ui",{headers:{authorization:"Bearer "+state.token}});if(!r.ok)throw new Error("DASHBOARD_ACCESS_NOT_AUTHORIZED");const html=await r.text();document.open();document.write(html);document.close()}
$("requestCode").onclick=async()=>{try{state.email=$("email").value.trim().toLowerCase();if(!state.email)throw new Error("APPROVED_EMAIL_REQUIRED");$("requestCode").disabled=true;await post("/auth/request",{email:state.email});$("codeStep").classList.remove("hidden");showMessage("One-time code sent to the approved email address.")}catch(e){showMessage(e.message,true)}finally{$("requestCode").disabled=false}};
$("verifyCode").onclick=async()=>{try{$("verifyCode").disabled=true;const entered=$("code").value.trim();let verification={email:state.email,token:entered};if(/^https?:\/\//i.test(entered)){const link=new URL(entered);const tokenHash=link.searchParams.get("token")||link.searchParams.get("token_hash");if(!tokenHash)throw new Error("INVALID_SIGN_IN_LINK");verification={email:state.email,tokenHash}}const data=await post("/auth/verify",verification);state.token=data.access_token;sessionStorage.setItem("loberas_access_token",state.token);await openDashboard()}catch(e){sessionStorage.removeItem("loberas_access_token");state.token="";showMessage(e.message,true)}finally{$("verifyCode").disabled=false}};
if(state.token)openDashboard().catch(()=>{sessionStorage.removeItem("loberas_access_token");state.token=""});
</script>
</body>
</html>
